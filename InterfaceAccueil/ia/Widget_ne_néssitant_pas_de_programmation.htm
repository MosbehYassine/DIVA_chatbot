<h1>Widget ne nécessitant pas de programmation</h1>
<p>&#160;</p>
<p>Les widgets Search, Calendrier, Météo et Bloc-Note ne nécessitent aucune programmation.</p>
<p>Le widget Flux RSS ne nécessite pas de programmation, mais demande de la configuration via le Zoom des Widgets.</p>
