<h3>Zoom.ModifFlg</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Ce code de retour est positionné par le zoom. Il vaut&#160;:</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_OUI</span> si la table a été modifiée par cette session du zoom (modification, ajout, suppression).</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_NON</span> si le zoom n'a été utilisé qu'en consultation.</p>
</li>
</ul>
<p class="Body-Text">&#160;</p>
