<h3>ZoomViderSelection</h3>
<p>&#160;</p>
<p>Cette procédure permet de désélectionner par programme les lignes sélectionnées par l'opérateur. Consultez la rubrique <a href="S_lection_multiple.htm">Sélection multiple</a>.</p>
<p>&#160;</p>
<p class="Body-Text"><font style="font-weight: bold;">Rappel</font></p>
<p class="Body-Text">Pour appeler cette procédure, il est nécessaire de déclarer le module xzoom7.dhop par l'instruction module "xzoom7.dhop".</p>
<p class="body-text">&#160;</p>
