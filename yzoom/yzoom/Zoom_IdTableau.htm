<h3>Zoom.IdTableau</h3>
<p>&#160;</p>
<p>Cette donnée contient l'identifiant de l'objet tableau du mode liste. Elle peut-être utilisée par exemple dans la séquence ZoomEnteteTableau pour modifier les en-têtes du tableau courant (mettre une bitmap par exemple).</p>
