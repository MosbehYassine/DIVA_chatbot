<h3>Séquences de traitement du Zoom</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">A certains points stratégiques, l'exécuteur de zoom (xZoom7.dhop) appelle les procédures du <a href="ModuleDivaduZoom.htm">module de traitements</a> associé. Ces procédures servent à paramétrer le zoom et à intervenir sur son déroulement. Le nom de ces procédures est préfixé par Zoom.</p>
