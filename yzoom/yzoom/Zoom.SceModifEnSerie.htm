<h3>Zoom.SceModifEnSerie</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Indique si la fonction de modification en série est ou non autorisée. Ce paramètre vaut :</p>
<ul>
<li style="font-size: 10pt;" class="p-Body-Text">
<p class="Body-Text" style="margin-left: 11.75pt;"><span class="hcp1">ZOOM_OUI</span> lorsque la modification en série est autorisée (valeur par défaut).</p>
</li>
<li style="font-size: 10pt;" class="p-Body-Text">
<p class="Body-Text" style="margin-left: 11.75pt;"><span class="hcp1">ZOOM_NON</span> lorsqu'elle est interdite.</p>
</li>
</ul>
<p class="Body-Text" style="margin-left: 11.75pt;">&#160;</p>
<p class="Body-Text">&#160;</p>
<p class="Body-Text" style="margin-left: 11.75pt;">&#160;</p>
