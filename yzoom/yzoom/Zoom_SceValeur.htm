<h3>Zoom.SceValeur</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Permet au programme appelant de passer une valeur en paramètre au zoom.</p>
<p class="Body-Text">Par exemple, une clé de départ pour une consultation, la valeur de la clé à créer ou à supprimer.</p>
