<h3>DDGetTextError3 &#160;<a href="Listedesinstructionsd_acc_saudictionnairedesdonn_es.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Introduction6.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction DDGetTextError3 permet de récupérer le message d'erreur des fonctions DDGetRecord3 et DDGetNextData3.</p>
<p class="Body-Text"><font class="hcp2"><br>
Char</font> <font class="hcp2">DDGetTextError3</font></p>
<p class="Body-Text">&#160;&#160;<br>
<font class="hcp2">Retour</font></p>
<p class="Body-Text">Le texte d'erreur correspondant à la dernière erreur de lecture du dictionnaire.</p>
<p class="Body-Text"><br>
<font class="hcp2">Voir</font></p>
<p class="Body-Text"><a href="DDGetRecord3.htm">DDGetRecord3</a>, <a href="DDNextData3.htm">DDNextData3</a></p>
