<h3>Ishexa</h3>
<p class="Body-Text">La fonction Ishexa permet de vérifier qu'une donnée ne contient que des caractères hexadécimaux c'est à dire compris dans les intervalles 0-9 et A-F.</p>
<p class="Body-Text"><br>
<font class="hcp1">Long</font> <font class="hcp1">i</font><font class="hcp1">shexa</font> ( <font style="font-style: italic;">donnée</font>)</p>
<p class="Body-Text"><br>
<font class="hcp1">Retour</font></p>
<table cellspacing="0" width="436">
<tr class="hcp2">
<td style="width:18.40%;" class="hcp3">
<p class="Body-Text">0</p>
</td>
<td style="width:81.60%;" class="hcp3">
<p class="Body-Text">Faux</p>
</td>
</tr>
<tr class="hcp2">
<td style="width:18.40%;" class="hcp3">
<p class="Body-Text">1</p>
</td>
<td style="width:81.60%;" class="hcp3">
<p class="Body-Text">Vrai.</p>
</td>
</tr>
</table>
<p class="Body-Text"><br>
<font class="hcp1">Remarque</font></p>
<p class="Body-Text">Les caractères minuscules (a-f) ne sont pas considérés comme hexadécimaux.</p>
