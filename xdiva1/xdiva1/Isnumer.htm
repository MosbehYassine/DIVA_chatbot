<h3>Isnumer</h3>
<p class="Body-Text">La fonction Isnumer permet de vérifier qu'une donnée<br>
- ne contient que des caractères numériques (0..9),<br>
- éventuellement des espaces,<br>
- éventuellement un signe et une virgule.</p>
