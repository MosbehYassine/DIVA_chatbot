<h1>WinShell_FreeAllFile <a href="Liste_des_fonctions_WinShell_.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Contexte.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h1>
<p>&#160;</p>
<p>Cette fonction permet de retirer tous les fichiers de la liste interne de suivi des fichiers exécutés par la fonction <a href="WinShell_Execute.htm">WinShell_Execute</a>.</p>
<p>&#160;</p>
<p style="font-weight: bold;">long WinShell_FreeAllFile</p>
<p>&#160;</p>
<p>&#160;</p>
<p class="Body-Text" style="font-style: normal; font-weight: bold;">Retour</p>
<p class="Body-Text" style="font-style: normal;">La valeur de retour de cette fonction est non signifiante</p>
<p class="body-text">&#160;</p>
