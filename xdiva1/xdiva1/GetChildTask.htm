<h1>GetChildTask <a href="InstructionsdeModulesetProgrammes.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="G_n_ralit_s1.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h1>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">Cette fonction permet de connaître le numéro de tâche du dernier programme lancé par ProgramCall.</p>
<p class="Body-Text" style="font-weight: bold;">int GetChildTask</p>
<p class="Body-Text">&#160;</p>
<p class="Body-Text"><font style="font-weight: bold;">Retour</font></p>
<p class="Body-Text">Le numéro de la tâche du dernier programme lancé par ProgramCall.</p>
<p class="Body-Text">&#160;</p>
