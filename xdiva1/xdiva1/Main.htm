<h3>Main</h3>
<p class="Body-Text">L'instruction Main (sans paramètres) indique que le module est un programme.</p>
<p class="Body-Text">Elle indique le début de l'exécution du programme, c'est à dire qu'elle est la première instruction exécutée.</p>
