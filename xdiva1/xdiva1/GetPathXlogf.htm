<p>Elle tient compte du paramètre ServeurXlogf de Divalto.ini.</p>
<p class="hcp1">&#160;</p>
<p><font class="hcp2">Alpha</font> <font class="hcp2">GetPathXlogf</font></p>
<p class="hcp1">&#160;</p>
