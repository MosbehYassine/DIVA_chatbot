<h3>XmlGetError &#160;<a href="Liste_des_fonctions_Xml.htm"><font class="hcp1">Famille</font></a> &#160;<a href="Fonctions_Xml.htm"><font class="hcp1">Thème</font></a></h3>
<p class="Body-Text">La fonction XmlGetError permet de récupérer un libellé en cas d’erreur lors de la lecture du flux.</p>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text"><font class="hcp2">Alpha</font> <font class="hcp2">XmlGetError</font> ()</p>
<p class="decalage05" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text"><font class="hcp2">Retour</font></p>
<p class="Body-Text">La fonction retourne le message d’erreur complet renvoyé par les fonctions XML du framework .Net.</p>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
