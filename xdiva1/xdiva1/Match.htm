<h3>Match &#160;<a href="Op_rateurs_r_sum_.htm"><font style="font-family: 'MS Sans Serif'; font-weight: normal;" face="MS Sans Serif">Famille</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">L'opérateur MATCH est identique à <a href="Like.htm">Like</a> mais il n'y a pas de conversion en majuscules dans la chaîne.</p>
<p class="Body-Text">Exemples :</p>
<p class="Body-Text">CH = "Dupont"<br>
CH LIKE "DUPONT" est vrai<br>
CH MATCH "DUPONT" est faux</p>
