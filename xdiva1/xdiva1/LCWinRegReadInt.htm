<h1>LCWinRegReadInt &#160;<span style="font-weight: normal;"><a href="Liste_des_fonctions_LC.htm">Famille</a> <a href="Introduction_devLC.htm">Thème</a></span></h1>
<p class="Body-Text">La fonction LCWinRegReadInt permet de lire une valeur entière dans le registre.</p>
<p class="Body-Text">Si la valeur est de type REG_SZ dans le registre, la chaine est convertie en valeur numérique.</p>
<p class="Body-Text">Cette fonction se trouve dans le module ysystemex.dhop.</p>
<p class="Body-Text">&#160;</p>
