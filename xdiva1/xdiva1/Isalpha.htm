<h3>Isalpha</h3>
<p class="Body-Text">La fonction Isalpha permet de tester qu'une donnée ne contient que des lettres et des chiffres.<br></p>
<p class="Body-Text"><font class="hcp1">Long</font> <font class="hcp1">i</font><font class="hcp1">salpha</font> (<font style="font-style: italic;">donnée</font>)</p>
<p class="Body-Text"><br>
<font class="hcp1">Retour</font></p>
<p class="Body-Text">La fonction renvoie 1 en cas de succès, 0 sinon.</p>
<p class="Body-Text"><br>
<font class="hcp1">Voir</font></p>
