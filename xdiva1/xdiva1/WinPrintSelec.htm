<h3>WinPrintSelec &#160;<a href="ListedesfonctionsdegestiondefichiersWindows.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="FonctionsdegestiondefichiersWindows.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text">La fonction WinPrintSelec permet d’appeler une boîte de dialogue de sélection des imprimantes.</p>
<p class="Body-Text"><font class="hcp2">Alpha WinPrintSelec</font></p>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text"><font class="hcp2">Retour</font></p>
<p class="Body-Text">La fonction renvoie le nom de l’imprimante sélectionnée ou espaces si l’utilisateur n’a rien sélectionné (abandon).</p>
<p class="Body-Text"><font class="hcp2">Voir</font></p>
