<h3>Pour faire apparaître la fenêtre du projet</h3>
<p>La fenêtre du projet peut être cachée.</p>
<p>&#160;</p>
<p>Dans ce cas, sélectionnez le choix Projet du menu Fenêtre (raccourci clavier : Alt+0)</p>
<p>OU</p>
<p>Cliquez sur l’onglet vertical Projet</p>
<p>&#160;</p>
<p>Pour que cette fenêtre reste affichée en permanence, épinglez-là.</p>
