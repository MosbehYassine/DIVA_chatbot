<h3>Introduction à la gestion des projets</h3>
<p class="Body-Text">Toutes les opérations pour gérer les projets et les sous-projets peuvent être faites depuis l'arbre des projets.</p>
<p class="Body-Text">Seules exceptions : l'ouverture d'un projet et la création d'un projet se font depuis le menu <font style="font-weight: bold;">Fichier</font>.</p>
