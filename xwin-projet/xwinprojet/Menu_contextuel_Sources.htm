<h3>Menu contextuel Sources</h3>
<p>&#160;</p>
<p>Le menu contextuel <font class="hcp1">Sources</font> propose les commandes :</p>
<ul style="list-style: square;">
<li style="font-size: 8pt;" class="p">
<p><font class="hcp1">Ajouter</font> : ajouter des sources au sous-projet.</p>
</li>
<li style="font-size: 8pt;" class="p">
<p><font class="hcp1">Ajouter le source courant</font> : ajout dans le sous-projet du source en cours d'édition dans Xwin.</p>
</li>
</ul>
