<h2>Enchaînement de programmes</h2>
<p class="Body-Text">Un programme Diva peut enchaîner à un autre programme par l'instruction ProgramGoto. Le programme en cours d'exécution est arrêté et remplacé par le nouveau programme. Le programme appelant peut passer des données au programme appelé en utilisant le tunnel.</p>
