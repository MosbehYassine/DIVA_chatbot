<h3>Ajout d'un nouvel utilisateur</h3>
<p class="Body-Text">Pour ajouter un nouvel utilisateur (par exemple à l'occasion de l'ajout d'un nouveau terminal), créez d'abord un compte d'utilisateur sous Windows puis dans le fichier des utilisateurs d’Harmony (Xlogf). Ensuite, ouvrez une session sous ce compte.</p>
