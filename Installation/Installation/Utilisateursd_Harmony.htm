<h2>Utilisateurs d'Harmony</h2>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Tout utilisateur travaillant sous Harmony doit s'identifier, de manière à mettre en place ses <a href="Chemins_etbiblioth_ques_unit_s_implicites.htm">chemins implicites</a> et ses droits d'accès Harmony. A cet effet, Harmony utilise une table stockée dans le fichier <font style="font-weight: bold;">XLOGF</font>.</p>
