<h3>Fichier BQY</h3>
<p class="Body-Text">Un fichier BQY contient un document Hyperion avec ses différentes sections : interrogation, résultat, pivot, graphique, rapport, etc. Il fait référence au fichier OCE qui a permis la connexion à la base de données.</p>
