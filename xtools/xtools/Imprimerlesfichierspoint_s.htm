<h4>Imprimer les fichiers pointés</h4>
<p class="Body-Text">La liste des fichiers pointés est appelée par&#160;:</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">La touche <font class="hcp1">Ctrl+P</font>.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">Le choix du menu &lt;<font class="hcp1">Fichier</font> <font style="font-family: Symbol; font-weight: bold;" face="Symbol">®</font> <font class="hcp1">Imprimer</font>&gt;.</p>
</li>
</ul>
<p class="Body-Text">&#160;<br>
Cette fonction imprime une ligne pour chaque fichier pointé, reprenant en partie les informations affichées dans le tableau de pointage.</p>
