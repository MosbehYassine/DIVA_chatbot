<h3>Se placer sur une page précise</h3>
<p class="Body-Text">Pour se placer sur une page précise d'un masque :</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">Sélectionnez le choix <font class="hcp1">Numéro</font> du menu <font class="hcp1">Page</font>.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">La boîte de dialogue "&#160;Aller à la page&#160;" apparaît.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">Entrez un <font class="hcp1">numéro de page</font> et validez par <font class="hcp1">OK</font>.</p>
</li>
</ul>
</body>
