<h3>Commentaire</h3>
<p class="Body-Text">La famille <span style="font-weight: bold;">Commentaire</span> permet de définir un commentaire pour l'objet.</p>
<p class="Body-Text">Cliquez dans la zone Commentaire pour ouvrir la boîte de saisie de texte standard de Windows.</p>
<p class="body-text">&#160;</p>
<p class="body-text" style="font-weight: bold;">Remarque <span style="font-weight: normal;">:</span> <span style="margin-left: 48px; font-weight: normal;">Une ligne de commentaire ne doit pas commencer par le caractère [.</span></p>
<p>&#160;</p>
