<h3>Installation du runtime</h3>
<p class="Body-Text">Pour l'installation du runtime d'HARMONY FORTISSIMO consultez le manuel de référence d'HARMONY.</p>
<p class="Body-Text">Le runtime d'HARMONY est <font style="font-weight: bold;">nécessaire</font> sur le serveur pour la création et la copie des fichiers dans SQL (utilitaire XPSQL.dhop), ainsi que pour d'éventuels travaux de maintenance.</p>
