<h1>GetRowNumber &#160;<span style="font-weight: normal; font-family: 'Microsoft Sans Serif', sans-serif;"><a

 &#160;<a href="Introduction.htm">Thème</a></span></h1>
<p>&#160;</p>
<p>La méthode GetRowNumber permet d'obtenir le numéro d'ordre de la ligne 
 courante pour le Select en cours</p>
<p>&#160;</p>
<p><span class="hcp1">Long</span> RecordSql.<span class="hcp1">GetRowNumber</span> 
 ()&#160;</p>
<p>&#160;</p>
<p class="Body-Text"><font style="font-weight: bold;">Retour</font></p>
<p>La fonction renvoie le numéro d'ordre de la dernière ligne lue.</p>
