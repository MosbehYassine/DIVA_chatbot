<h3>Aperçus avant impression</h3>

<p class=Body-Text>L'utilisateur peut obtenir un aperçu à l'écran de tous 
 les états imprimés, grâce à l'utilitaire DivaltoViewer. Avec Harmony Plus, 
 les états imprimés peuvent être envoyés par exemple vers un fax, une messagerie 
 locale ou Internet.</p>
