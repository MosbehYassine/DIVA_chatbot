<h3>Pour déconnecter le débogueur d'un programme</h3>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">Sélectionnez le choix <font class="hcp1">Détacher la tâche</font> du menu <font class="hcp1">Déboguer</font>.</p>
</li>
</ul>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Utilisez cette commande pour stopper le débogage d'un programme, avec poursuite normale de son exécution.</p>
