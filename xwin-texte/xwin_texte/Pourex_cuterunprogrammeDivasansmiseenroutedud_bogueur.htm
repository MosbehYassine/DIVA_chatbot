<h3>Pour exécuter un programme Diva sans mise en route du débogueur</h3>
<ol style="list-style: decimal;">
<li class="p-Body-Text">
<p class="Body-Text">Si ce n'est déjà fait, <a href="Param_trerlesex_cutions.htm">paramétrez le nom du programme à exécuter</a>.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">Sélectionnez le choix <font class="hcp1">Exécuter sans déboguer</font> du menu <font class="hcp1">Projet</font> (raccourci clavier&#160;: <font class="hcp1">Ctrl+F5</font>).</p>
</li>
</ol>
