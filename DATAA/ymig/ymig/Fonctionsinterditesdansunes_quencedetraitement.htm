<h3>Fonctions interdites dans une séquence de traitement</h3>
<p class="Body-Text">Les fonctions suivantes de Ymig ne peuvent être appelées dans une séquence de traitement liée au masque d'impression&#160;:</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">XmiLoad.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">XmiPrint et XmiPrint1.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">XmiRet.</p>
</li>
</ul>
