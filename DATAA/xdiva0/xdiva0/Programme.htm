<h3>Programme</h3>
<p class="Body-Text">Un programme est un module dont on peut lancer l'exécution depuis Windows ou depuis un menu.</p>
<p class="Body-Text">Pour qu'un module soit un programme il doit contenir l'instruction Main. L'instruction Main doit se trouver en dehors de toute fonction/procédure. Elle est la première instruction exécutée.</p>
