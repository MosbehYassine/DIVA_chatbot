<h3>Ajouter touches</h3>
<p class="Body-Text">Ce choix permet d'ajouter simultanément des pièges de touche à plusieurs objets précédemment sélectionnés.</p>
<p class="Body-Text">Si, pour un objet donné, la touche était déjà piégée, le piège de cette touche pour cet objet n'est pas modifié.</p>
<p class="Body-Text">&#160;</p>
