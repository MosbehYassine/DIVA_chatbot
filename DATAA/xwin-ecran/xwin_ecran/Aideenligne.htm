<h3>Aide en ligne</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Vous accédez à la <font class="hcp1">documentation de l'éditeur Xwin</font> et, en particulier, de l'éditeur de masques&#160;:</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">En sélectionnant le choix <font class="hcp1">Editeurs</font> du menu <font class="hcp1">Aide</font>.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">En cliquant sur le bouton <img src="../image/btn_aide.bmp" alt="" width="16" height="16" border="0"> de la barre d'outils principale.</p>
</li>
</ul>
