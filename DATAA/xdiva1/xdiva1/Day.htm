<h3>Day &#160;<a href="ListedesfonctionsdeDateetHeure.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Fonctionsdedateetheure.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction Day retourne le numéro du jour dans le mois.</p>
<p class="Body-Text"><br>
<font class="hcp2">Ptr</font> <font class="hcp2">Day</font> (<font class="hcp3">date</font>)</p>
<p class="Body-Text"><font class="hcp2"><br>
Paramètres</font></p>
<p class="Body-Text"><font class="hcp3">Date</font></p>
<p class="decalage05">Donnée de type date.</p>
<p class="Body-Text"><br>
<font class="hcp2">Retour</font></p>
<p class="Body-Text">Cette fonction renvoie le numéro du jour en type X.<br>
Elle est équivalente à : <font face="Courier New" class="hcp4">n</font><font face="Courier New" class="hcp4">mid(</font><font face="Courier New" class="hcp4">d</font><font face="Courier New" class="hcp4">ate,</font><font face="Courier New" class="hcp4">s</font><font face="Courier New" class="hcp4">ize(</font><font face="Courier New" class="hcp4">d</font><font face="Courier New" class="hcp4">ate)-1,2,0)</font></p>
