<h3>Today &#160;<a href="ListedesfonctionsdeDateetHeure.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Fonctionsdedateetheure.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction Today permet de connaître la date du jour en cours. Elle n'a pas de paramètres.</p>
<p class="Body-Text"><font class="hcp2">Date</font> = <font class="hcp2">t</font><font class="hcp2">oday</font></p>
&#160;
<p class="Body-Text"><font class="hcp2">Retour</font></p>
<p class="Body-Text">today renvoie la date du jour au format AAAAMMJJ.</p>
