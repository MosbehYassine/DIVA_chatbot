<h3>Loga &#160;<a href="Listedesfonctionsmath_matiques.htm"><font style="font-family: 'MS Sans Serif'; font-weight: normal;" face="MS Sans Serif">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction Loga calcule le logarithme de base quelconque.</p>
<p class="Body-Text"><br>
<font class="hcp1">Numer</font> <font class="hcp1">Loga</font> (<font class="hcp2">x , base</font>)</p>
<p class="Body-Text"><font class="hcp1"><br>
Paramètres</font></p>
<p class="Body-Text"><font class="hcp2">x</font></p>
<p class="decalage05">Valeur numérique. La fonction Loga est définie pour <font class="hcp2">x</font> &gt; 0.</p>
<p class="Body-Text"><font class="hcp2">Base</font></p>
<p class="decalage05">Valeur numérique positive indiquant la base du logarithme.</p>
<p class="Body-Text"><br>
<font class="hcp1">Retour</font></p>
<p class="Body-Text">Valeur du logarithme.</p>
