<h3>Introduction</h3>
<p class="Body-Text">Diva dispose de fonctions permettant d'appeler directement un module d'Harmony sans passer par une instruction spécifique du langage.</p>
<p class="Body-Text">L'utilisation de ces fonctions est exceptionnelle, vu qu'il existe des instructions Diva correspondant aux différentes fonctions des modules.</p>
