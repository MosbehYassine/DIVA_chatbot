<h1>LCWinRegDeleteKey &#160;<span style="font-weight: normal;"><a href="Liste_des_fonctions_LC.htm">Famille</a> <a href="Introduction_devLC.htm">Thème</a></span></h1>
<p class="Body-Text">La fonction WinRegDeleteKey permet de supprimer une clé du le registre Windows.</p>
<p class="Body-Text">Toutes les valeurs sous la clé et la clé elle-même sont supprimées.</p>
<p class="Body-Text">Cette fonction se trouve dans le module ysystemex.dhop.</p>
