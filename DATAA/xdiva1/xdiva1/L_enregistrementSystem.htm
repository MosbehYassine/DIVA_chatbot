<h3>L'enregistrement System</h3>
<p class="Body-Text">Lors de l'exécution d'un programme, l'enregistrement System (dictionnaire ddsys.dhsd) contient des paramètres propres de la tâche (nom du programme chargé, code utilisateur etc.).</p>
<p class="Body-Text">L'enregistrement System est déclaré dans le fichier d'include standard Zdiva.dhsp.</p>
