<h3>Round</h3>
<p class="Body-Text"><font class="hcp1">Round</font></p>
<p class="Body-Text">&#160;<br>
A partir de l'exécution d'une instruction Round, les affectations se font avec arrondi. C'est le mode par défaut au lancement du programme.</p>
<p class="Body-Text">L'instruction <a href="Truncate.htm">Truncate</a> permet de changer ce mode et de faire les affectations avec troncature.</p>
