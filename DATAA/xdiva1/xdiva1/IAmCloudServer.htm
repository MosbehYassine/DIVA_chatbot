<h1>IAmCloudServer</h1>
<p>&#160;</p>
<p>La fonction <span style="font-weight: bold;">IAmCloudServer</span> permet de savoir si le programme s'exécute sur une plate forme cloud.</p>
&#160;
<p class="Body-Text" style="font-weight: bold;">BOOL IAmCloudServer</p>
&#160;
<p class="Body-Text"><font style="font-weight: bold;">Retour</font></p>
<p>La fonction renvoie TRUE si le programme s'exécute sur un serveur du cloud.</p>
<p>&#160;</p>
<p style="font-weight: bold;">Voir</p>
<p><a href="GetXlanServerCloud.htm">GetXlanServerCloud</a></p>
