<h3>Isdate &#160;<a href="ListedesfonctionsdeDateetHeure.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Fonctionsdedateetheure.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction Isdate permet de tester la validité d'une date.</p>
<p class="Body-Text"><br>
<font class="hcp2">Ptr</font> <font class="hcp2">Isdate</font> ( <font class="hcp3">date</font> )</p>
<p class="Body-Text"><font class="hcp2"><br>
Paramètres</font></p>
<p class="Body-Text"><font class="hcp3">Date</font></p>
<p class="decalage05">Donnée de type date (AAAAMMJJ) à vérifier.</p>
<p class="Body-Text">&#160;<br>
<font class="hcp2">Retour</font></p>
<p class="Body-Text">La fonction retourne la valeur 1 si <font class="hcp3">date</font> est correcte, 0 dans le cas contraire.</p>
<p class="Body-Text"><br>
<font class="hcp2">Voir</font></p>
<p class="Body-Text"><a href="Fdate.htm">Fdate</a> , <a href="FDateDH.htm">FDateDH</a> , <a href="FDateDM.htm">FDateDM</a></p>
