<h3>IsProgramCalled &#160;<a href="InstructionsdeModulesetProgrammes.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="G_n_ralit_s1.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">Cette fonction permet de tester si le programme a été lancé par un enchaînement (ProgramGoto) ou par un appel (ProgramCall).</p>
<p class="Body-Text"><font class="hcp2">int IsProgramCalled</font></p>
<p class="Body-Text"><font class="hcp2">Retour</font></p>
<p class="Body-Text">1 si le programme a été appelé par ProgramCall, 0 sinon.</p>
<p class="Body-Text">&#160;</p>
