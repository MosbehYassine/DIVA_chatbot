<h3>GetUserName</h3>
<p>La fonction GetUserName permet de récupérer le code utilisateur Windows avec lequel l’utilisateur courant s’est identifié.</p>
&#160;
<p class="Body-Text"><font class="hcp1">Alpha</font> <font class="hcp1">GetUserName</font></p>
&#160;
<p class="Body-Text"><font class="hcp1">Retour</font></p>
<p>La fonction renvoie le code de l’utilisateur actuellement connecté.<br>
&#160;</p>
<p class="Body-Text" style="font-weight: bold;">Voir</p>
<p class="Body-Text" style="font-weight: normal;"><a href="WinGetUserNameEx.htm" style="font-weight: normal;">WinGetUserNameEx</a></p>
