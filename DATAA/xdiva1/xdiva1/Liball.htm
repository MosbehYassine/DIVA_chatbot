<h3>Liball &#160;<a href="Listedesfonctionsdebasedegestiondefichiers.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a href="Lepartagedesenregistrements.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">Liball libère <font class="hcp2">tous</font> les enregistrements réservés par une tâche.</p>
<p class="Body-Text"><br>
<font class="hcp2">Liball</font></p>
<p class="Body-Text"><br>
L'instruction Liball n'a pas de paramètres. Tous les enregistrements préalablement réservés avec un code réservation quelconque sont libérés.</p>
<p class="Body-Text"><br>
