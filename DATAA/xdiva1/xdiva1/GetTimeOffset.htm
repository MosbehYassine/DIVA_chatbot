<h1>GetTimeOffset&#160;<a href="ListedesfonctionsdeDateetHeure.htm"><font face="MS Sans Serif" class="hcp1">Famille</font></a><font 
	 style="font-family: 'MS Sans Serif';" face="MS Sans Serif">&#160;</font><a 
	 href="Fonctionsdedateetheure.htm"><font face="MS Sans Serif" class="hcp1">Thème</font></a></h1>
<p class="Body-Text">La fonction GetTimeOffset retourne le décalage entre 
 le client et le serveur.</p>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text"><font class="hcp2">Numer GetTimeOffset 
 </font></p>
&#160;&#160;
<p class="Body-Text"><font class="hcp2">Retour</font></p>
<p class="Body-Text">La fonction retourne le nombre de minutes de décalage 
 entre le client et le serveur. La valeur peut être négative.</p>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">&#160;</p>
