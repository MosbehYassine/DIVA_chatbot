<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">La fonction GetListConf permet de récupérer la liste 
 des codes de confidentialité</p>
<p class="Body-Text">&#160;</p>
<p class="Body-Text"><font class="hcp2">Long</font> = <span 
	 style="font-weight: bold;">GetListConf</span></p>
<p class="Body-Text">&#160;<font class="hcp2"><br>
Retour</font></p>
&#160;
<p>La fonction renvoie un nouvel identifiant de liste. Cette liste devra 
 être détruite après utilisation.</p>
