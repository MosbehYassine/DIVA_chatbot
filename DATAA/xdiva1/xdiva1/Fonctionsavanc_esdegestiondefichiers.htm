<h3>Fonctions avancées de gestion de fichiers</h3>
<p class="Body-Text">Les fonctions avancées de gestion de fichier permettent :</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">de lire et modifier les caractéristiques d'un fichier,</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">d'appeler la boîte de dialogue d'ouverture des fichiers,</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">de créer des répertoires,</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">d'analyser un nom de fichier</p>
</li>
</ul>
