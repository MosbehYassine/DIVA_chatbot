<h3>OR &#160;<a href="Op_rateurs_r_sum_.htm"><font style="font-family: 'MS Sans Serif'; font-weight: normal;" face="MS Sans Serif">Famille</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text"><font class="hcp1">Expression1</font> <font style="font-weight: bold;">Or</font> <font class="hcp1">Expression2</font></p>
<p class="Body-Text">Le résultat de l'opérateur Or est 1 si une des deux expressions est vraies, 0 si les deux expressions sont fausses.</p>
<p class="Body-Text">Si <font class="hcp1">expression1</font> est vraie, <font class="hcp1">expression2</font> n'est pas évaluée (court-circuit).</p>
<p class="Body-Text">Exemple : <font style="font-family: 'Courier New';" face="Courier New">If a = 10 Or b = 1</font></p>
