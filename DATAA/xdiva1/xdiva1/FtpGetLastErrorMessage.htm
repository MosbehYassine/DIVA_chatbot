<h1>FtpGetLastErrorMessage</h1>
<p>&#160;</p>
<p>Les fonctions FTP retournent une structure FtpResult.</p>
<p>La zone Desc est limitée à 256 caractères, et il se peut que le texte 
 de l'exception soit tronqué.</p>
<p>FtpGetLastErrorMessage permet de récupérer l'intégralité du message 
 d'erreur.</p>
<p>&#160;</p>
<p><span style="font-weight: bold;">Char FtpGetLastErrorMessage</span> 
 &#160;()</p>
