<h2>Voies V24 et imprimante parallèle</h2>
<p class="Body-Text">Il existe deux cas pour lesquels vous devez déclarer une voie de type V24 :</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text">Utilisation d'un logiciel de communication.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text">Impression "directe" (c'est à dire sans passer par le spouleur de Windows) sur une voie série ou parallèle.</p>
</li>
</ul>
