<h3>Aide</h3>
<p class="Body-Text">Ce choix équivaut à la frappe de <font style="font-weight: bold;">Shift+F1</font>. Il appelle l'aide fenêtrée de l'application. Si le choix est grisé, cela signifie qu'aucune aide n'a été prévue à cet endroit par le concepteur.</p>
