<h3>Imprimante par défaut de Windows</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Le gestionnaire d'impression permet de définir une imprimante "par défaut". Lors d'une édition, c'est cette imprimante qui sera automatiquement utilisée si aucune autre imprimante n'est sélectionnée auparavant.</p>
