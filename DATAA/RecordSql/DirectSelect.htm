<h3>RecordSql.DirectSelect &#160;&#160;<span style="font-weight: normal; font-family: 'Microsoft Sans Serif', sans-serif;"><a href="Liste_des_m&eacute;thodes_et_fonctions_sur_les_RecordSql.htm">Famille</a> &#160;<a href="Introduction.htm">Thème</a></span></h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">La méthode DirectSelect exécute la requête et renvoie la première ligne de résultat. La requête a été préalablement complétée par <a href="SqlSelect.htm">SqlSelect</a>. Pour lire les résultats il faut utiliser les fonctions &#160;<a href="DirectReaderNext.htm">DirectReaderNext</a> etc.</p>
