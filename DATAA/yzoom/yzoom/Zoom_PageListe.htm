<h1>Zoom.PageListe</h1>
<p>&#160;</p>
<p>Cette donnée contient le numéro de page qui représente la page de la liste.</p>
<p>&#160;</p>
<p>Elle est <span style="font-weight: bold;">modifiable uniquement dans la procédure ZoomDebut.</span></p>
<p class="hcp1">&#160;</p>
<p class="hcp1">Par défaut, la valeur est 3.</p>
