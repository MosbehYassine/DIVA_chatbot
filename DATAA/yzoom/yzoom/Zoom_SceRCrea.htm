<h3>Zoom.SceRCrea</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Correspond à l'option "Rester en création" :</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_OUI</span> indique qu'après la validation d'une création, le zoom propose directement de créer la fiche suivante.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_NON</span> indique qu'après la validation d'une création, le zoom repasse en consultation.</p>
</li>
</ul>
