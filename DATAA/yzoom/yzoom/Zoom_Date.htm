<h3>Zoom.Date</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Cette donnée contient la date du jour au format AAAAMMJJ. Elle est initialisée avant une impression en mode liste ou en mode fiche. Elle peut être utilisée pour imprimer la date du jour sur les états imprimés.</p>
