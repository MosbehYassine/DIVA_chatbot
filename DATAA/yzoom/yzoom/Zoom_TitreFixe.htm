<h3>Zoom.TitreFixe</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Contient la partie fixe du titre du zoom.<br>
Elle peut être passée en paramètre à l'appel du zoom ou être positionnée dans la séquence ZoomDebut.</p>
<p class="Body-Text">Le titre est affiché dans la barre de titre de la fenêtre Windows du zoom.</p>
