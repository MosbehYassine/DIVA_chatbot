<h3>Zoom.SceModeLF</h3>
<p class="Body-Text"><br>
Indique les modes d'affichage autorisés :</p>
<ul style="list-style: disc;">
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_AMODE_FICHE</span> autorise uniquement le mode fiche.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_AMODE_LISTE</span> autorise uniquement le mode liste.</p>
</li>
<li class="p-Body-Text">
<p class="Body-Text"><span class="hcp1">ZOOM_AMODE_TOUS</span> autorise le mode fiche et le mode liste.<br>
Cette valeur est obligatoire en mode d'affichage mixte.</p>
</li>
</ul>
<p class="Body-Text">&#160;</p>
