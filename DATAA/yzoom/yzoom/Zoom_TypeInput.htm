<h3 style="text-indent: 2.25pt;">Zoom.TypeInput</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Cette donnée indique le type de saisie ou consultation qui va être effectuée par le zoom. Elle est valide uniquement dans la procédure ZoomAvantInput&#160;et peut être utilisée pour griser les boutons et les choix du menu.</p>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Voir <a href="ZoomAvantInput.htm">ZoomAvantInput</a>.</p>
