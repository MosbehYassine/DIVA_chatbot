<h3>Zoom.Heure</h3>
<p class="Body-Text">&#160;</p>
<p class="Body-Text">Cette donnée contient l'heure courante au format HH:MM. Elle est initialisée avant une impression en mode liste ou en mode fiche. Elle peut être utilisée pour imprimer l'heure d'impression sur les états imprimés.</p>
