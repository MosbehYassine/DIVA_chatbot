<h1>Field Type</h1>
<p>L’attribut <span style="font-weight: bold; font-style: italic;">Type</span> permet d’indiquer le type des champs <span class="hcp1">«&#160;notes&#160;»</span> et <span class="hcp1">«&#160;pièces jointes&#160;»</span></p>
<p>&#160;</p>
<p style="font-weight: bold;"><img src="image14.jpg" style="border: none;" alt="" width="658" height="265" border="0"></p>
<p>Pour les pièces jointes, l’attribut <span class="hcp1">Indexed=false</span>, permet d’afficher le lien vers la pièce jointe, sans indexer son contenu.</p>
