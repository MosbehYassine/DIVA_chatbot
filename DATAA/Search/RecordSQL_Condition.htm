<h1>RecordSQL Condition</h1>
<p>L’attribut <span class="hcp1">Condition</span> indique le nom d’une condition <span class="hcp1">&lt;Where&gt;</span> du RecordSQL. Ceci permet de mutualiser un même RecordSQL pour plusieurs documents.</p>
<p><span class="hcp2">Attention</span> :Cet attribut ne s’applique qu’au <span class="hcp2">RecordSQL de base</span>.</p>
