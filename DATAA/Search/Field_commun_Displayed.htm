<h1>Field commun Displayed</h1>
<p>&#160;</p>
<p>La valeur par défaut de l'attribut <span style="font-weight: bold; font-style: italic;">Displayed</span> est <span class="hcp1">false</span>.</p>
<p>&#160;</p>
<p>La valeur <span class="hcp1">True</span> permet d’afficher les valeurs de ce field dans la colonne de gauche du filtrage en mode simple.</p>
<p>On ne prendra que des fields avec un nombre de <span class="hcp1">valeurs distinctes réduites</span>.</p>
