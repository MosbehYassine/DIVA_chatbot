<h3>Pour modifier les paramètres d'un sous-projet</h3>
<p>Pour modifier les paramètres d'un sous-projet vous pouvez :</p>
<p>cliquer avec le bouton droit et choisir <font class="hcp1">Paramètres</font></p>
<p>dans le menu <font class="hcp1">Projet</font> pointer sur <font class="hcp1">Sous-projet</font> et cliquer sur <font class="hcp1">Paramètres du sous projet xxxxx.</font></p>
