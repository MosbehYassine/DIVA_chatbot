<h3>Menu contextuel Divers</h3>
<p>&#160;</p>
<p>Le menu contextuel <font class="hcp1">Divers</font> propose les commandes :</p>
<ul style="list-style: square;">
<li style="font-size: 8pt;" class="p">
<p><font><span class="hcp2">A</span></font><span class="hcp2">jouter le source courant</span> : ajouter le source en cours d'édition dans le dossier.</p>
</li>
<li style="font-size: 8pt;" class="p">
<p><font class="hcp1">Ajouter</font> : ajouter un ou plusieurs fichiers dans le dossier.</p>
</li>
</ul>
