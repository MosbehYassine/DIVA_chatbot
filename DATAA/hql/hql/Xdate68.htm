<h3>Xdate68</h3>
<p class="Body-Text">La fonction Xdate68 permet de convertir une date de 6 caractères en une date complète sur 8 caractères. Les années de 0 et 49 deviennent 20xx alors que les années de 50 à 99 deviennent 19xx.</p>
<p class="Body-Text"><font class="hcp1">date</font> = <font class="hcp1">Xdate68</font> ( <font class="hcp2">date</font>_<font class="hcp2">origine_6</font> )</p>
<p class="Body-Text"><br>
<font class="hcp1">Paramètres</font></p>
<p class="Body-Text"><br>
<font class="hcp2">Date</font>_<font class="hcp2">Origine_6</font></p>
<p class="decalage05">Date origine sous la forme AAMMJJ</p>
