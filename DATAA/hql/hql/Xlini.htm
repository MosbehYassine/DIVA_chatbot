<h3>Xlini &#160;<a href="Listedesfonctionsdegestiondelistes.htm"><font size="2" class="hcp1">Famille</font></a><font style="font-size: 10pt;" size="2">&#160;</font><a href="Introduction5.htm"><font size="2" class="hcp1">Thème</font></a></h3>
<p class="Body-Text" style="margin-top: 0; margin-bottom: 0;">&#160;</p>
<p class="Body-Text">Xlini permet de changer la taille de l'identificateur des éléments de la liste ( valeur par défaut 20).</p>
<p class="Body-Text"><font class="hcp2">Xlitri</font> (<font class="hcp3">Lg_identificateur</font>)</p>
<p class="Body-Text"><font class="hcp2">Paramètres</font></p>
<p class="Body-Text"><font class="hcp3">Lg_identificateur</font></p>
<p class="decalage05">Nouvelle longueur de l'idenfificateur.</p>
<p class="Body-Text"><font class="hcp2">Remarques</font></p>
<p class="Body-Text">La longueur ne peut être changée que si la liste est vide.</p>
